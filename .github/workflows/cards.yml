name: Kartalarni yasash

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Post ID lar (vergul bilan), masalan hsk3-501,hsk3-502"
        type: string
        default: ""
      range:
        description: "Yoki oraliq, masalan hsk3:501-520"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kerakli dasturlar
        run: |
          pip install --quiet pillow
          cd tools/cards && npm install --silent && npx playwright install --with-deps chromium
      - name: Kartalarni chizish
        env:
          IDS: ${{ inputs.ids }}
          RANGE: ${{ inputs.range }}
        run: python3 tools/cards/make_cards.py --ids "$IDS" --range "$RANGE"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images data/posts.json
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -m "Kartalar yangilandi [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: Xato bo'lsa adminga xabar
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 -c "import sys; sys.path.insert(0,'scripts'); from notify import notify; notify('Kartalarni yasash ishi xato bilan tugadi.')"
