name: Doggy rasmlari (Cloudflare AI)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Post ID lar (vergul bilan), masalan hsk1-005,hsk1-006"
        type: string
        default: ""
      range:
        description: "Yoki oraliq: 5-14 (hsk1-005 … hsk1-014)"
        type: string
        default: "5-14"
      force:
        description: "Bor rasmlarni ham qayta yasash"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: doggy
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rasmlarni yasash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IDS: ${{ inputs.ids }}
          RANGE: ${{ inputs.range }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          [ -n "$IDS" ] && ARGS="$ARGS --ids $IDS"
          [ -n "$RANGE" ] && ARGS="$ARGS --range $RANGE"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python3 scripts/gen_doggy.py $ARGS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/doggy/raw || true
          if git diff --cached --quiet; then echo "Yangi rasm yo'q"; exit 0; fi
          git commit -m "Doggy rasmlari [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
