name: Kunlik quiz

on:
  schedule:
    - cron: '0 15 * * *'   # har kuni 20:00 (Asia/Tashkent)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sinov rejimi (hech narsa yuborilmaydi, logda ko'rinadi)"
        type: boolean
        default: false
      force:
        description: "Bugun yuborilgan bo'lsa ham qayta yuborish"
        type: boolean
        default: false
      date:
        description: "Sana (YYYY-MM-DD) — bo'sh qolsa bugun"
        type: string
        default: ""
      count:
        description: "Savollar soni"
        type: string
        default: "3"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Quiz yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DRY: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          COUNT: ${{ inputs.count || '3' }}
          QUIZ_DATE: ${{ inputs.date }}
        run: |
          ARGS="--count $COUNT"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python3 scripts/quiz.py $ARGS
      - name: Logni saqlash
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz_log.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Quiz log [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
