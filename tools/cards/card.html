<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/zcool-kuaile/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/fredoka/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/fredoka/500.css">
<style>@font-face{font-family:"PY";font-weight:800;src:url(node_modules/@fontsource/nunito/files/nunito-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-024F,U+1E00-1EFF;}@font-face{font-family:"PY";font-weight:800;src:url(node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format("woff2");}</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; background: #fff; overflow: hidden; }
.card { position: relative; width: 1080px; height: 1440px; padding: 110px 90px; font-family: 'Fredoka', sans-serif; color: #151515; }
.hanzi { font-family: 'ZCOOL KuaiLe', sans-serif; color: #D7261E; line-height: 1; margin-top: 30px; white-space: nowrap; }
.uz { font-weight: 700; text-transform: uppercase; line-height: 1.04; margin-top: 50px; max-width: 900px; }
.plate { position: absolute; left: 90px; bottom: 210px; background: #D7261E; color: #fff;
  border-radius: 70px 90px 64px 80px / 60px 70px 90px 64px; padding: 56px 70px 56px 56px; display: flex; gap: 36px; max-width: 640px; }
.plate::before { content: ''; position: absolute; left: 40px; top: -22px; width: 60px; height: 44px; background: #D7261E; border-radius: 10px 30px 0 0; transform: skewX(-20deg); }
.plate .bar { width: 6px; align-self: stretch; background: #fff; border-radius: 3px; }
.plate .py { font: 800 84px/1.15 'PY', sans-serif; white-space: nowrap; }
.plate .tl { font: 800 60px/1.15 'PY', sans-serif; white-space: nowrap; opacity: .95; }
.mascot { position: absolute; right: 30px; bottom: 110px; width: 560px; height: 600px; display: flex; align-items: flex-end; justify-content: center; }
.mascot img { max-width: 100%; max-height: 100%; object-fit: contain; }
.foot { position: absolute; left: 90px; right: 90px; bottom: 56px; display: flex; justify-content: space-between; font: 500 30px 'Fredoka'; color: #a3a3a3; }
.foot b { color: #D7261E; font-family: 'ZCOOL KuaiLe'; font-weight: 400; }
</style></head>
<body><div class="card">
  <div class="hanzi" id="hanzi"></div>
  <div class="uz" id="uz"></div>
  <div class="plate"><div class="bar"></div><div><div class="py" id="py"></div><div class="tl" id="tl"></div></div></div>
  <div class="mascot"><img id="m"></div>
  <div class="foot"><span><b>每日中文</b> · Daily Chinese with Doggy · ©</span><span id="num"></span></div>
</div>
<script>
function fit(el, max, min, width) {
  let s = max; el.style.fontSize = s + 'px';
  while (s > min && el.scrollWidth > width) { s -= 4; el.style.fontSize = s + 'px'; }
}
window.renderCard = async (c, mascot) => {
  const h = document.getElementById('hanzi'); h.textContent = c.hanzi.replace(/[？?]/g, '？');
  const len = [...c.hanzi].length;
  fit(h, len === 1 ? 430 : len === 2 ? 380 : len === 3 ? 290 : 200, 120, 900);
  const u = document.getElementById('uz'); u.textContent = c.uz;
  const t = c.uz.length;
  u.style.fontSize = (t <= 8 ? 150 : t <= 12 ? 124 : t <= 18 ? 100 : t <= 26 ? 82 : t <= 40 ? 66 : 54) + 'px';
  document.getElementById('py').textContent = c.pinyin;
  document.getElementById('tl').textContent = c.talaffuz;
  const py = document.getElementById('py');
  fit(py, 84, 56, 470);
  const tl = document.getElementById('tl'); fit(tl, 60, 40, 470);
  document.getElementById('num').textContent = c.label || `HSK 1 · ${c.n}/300`;
  const m = document.getElementById('m');
  if (m.getAttribute('src') !== mascot) { m.src = mascot; await new Promise((r) => { m.onload = r; m.onerror = r; }); }
  await document.fonts.ready;
  const box = document.querySelector('.mascot');
  const pr = document.querySelector('.plate').getBoundingClientRect().right;
  box.style.width = Math.max(380, Math.min(560, 1080 - 30 - pr - 24)) + 'px';
};
</script></body></html>
